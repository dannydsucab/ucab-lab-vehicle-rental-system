name: Java CI with Maven - Autograding

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      # ========================================
      # COMPILACIÓN (2 puntos)
      # ========================================
      - name: 🔨 Compilación del Proyecto (2 puntos)
        id: compilacion
        run: |
          echo "### 🔨 Compilación del Proyecto" >> $GITHUB_STEP_SUMMARY
          if mvn clean compile; then
            echo "✅ Compilación exitosa - 2 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=2" >> $GITHUB_OUTPUT
          else
            echo "❌ Compilación fallida - 0 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=0" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      # ========================================
      # PRUEBAS UNITARIAS (2 puntos cada una)
      # ========================================
      - name: 🧪 Test 1 - Alquilar Vehículo Ya Alquilado (2 puntos)
        id: test1
        continue-on-error: true
        run: |
          echo "### 🧪 Test 1: Alquilar Vehículo Ya Alquilado" >> $GITHUB_STEP_SUMMARY
          if mvn test -Dtest=AgenciaTest#testAlquilarVehiculoYaAlquilado; then
            echo "✅ Test pasado - 2 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=2" >> $GITHUB_OUTPUT
          else
            echo "❌ Test fallido - 0 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=0" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Test 2 - Alquilar Vehículo Disponible (2 puntos)
        id: test2
        continue-on-error: true
        run: |
          echo "### 🧪 Test 2: Alquilar Vehículo Disponible" >> $GITHUB_STEP_SUMMARY
          if mvn test -Dtest=AgenciaTest#testAlquilarVehiculoDisponible; then
            echo "✅ Test pasado - 2 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=2" >> $GITHUB_OUTPUT
          else
            echo "❌ Test fallido - 0 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=0" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Test 3 - Cancelar Alquiler (2 puntos)
        id: test3
        continue-on-error: true
        run: |
          echo "### 🧪 Test 3: Cancelar Alquiler" >> $GITHUB_STEP_SUMMARY
          if mvn test -Dtest=AgenciaTest#testCancelarAlquiler; then
            echo "✅ Test pasado - 2 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=2" >> $GITHUB_OUTPUT
          else
            echo "❌ Test fallido - 0 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=0" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Test 4 - Encapsulamiento (2 puntos)
        id: test4
        continue-on-error: true
        run: |
          echo "### 🧪 Test 4: Encapsulamiento" >> $GITHUB_STEP_SUMMARY
          if mvn test -Dtest=AgenciaTest#testEncapsulamiento; then
            echo "✅ Test pasado - 2 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=2" >> $GITHUB_OUTPUT
          else
            echo "❌ Test fallido - 0 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=0" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Test 5 - Listar Vehículos Disponibles (2 puntos)
        id: test5
        continue-on-error: true
        run: |
          echo "### 🧪 Test 5: Listar Vehículos Disponibles" >> $GITHUB_STEP_SUMMARY
          if mvn test -Dtest=AgenciaTest#testListarVehiculosDisponibles; then
            echo "✅ Test pasado - 2 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=2" >> $GITHUB_OUTPUT
          else
            echo "❌ Test fallido - 0 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=0" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Test 6 - Cliente es una Persona (2 puntos)
        id: test6
        continue-on-error: true
        run: |
          echo "### 🧪 Test 6: Cliente es una Persona" >> $GITHUB_STEP_SUMMARY
          if mvn test -Dtest=AgenciaTest#testClienteEsUnaPersona; then
            echo "✅ Test pasado - 2 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=2" >> $GITHUB_OUTPUT
          else
            echo "❌ Test fallido - 0 puntos" >> $GITHUB_STEP_SUMMARY
            echo "points=0" >> $GITHUB_OUTPUT
          fi
      
      # ========================================
      # CÁLCULO DE PUNTAJE TOTAL
      # ========================================
      - name: 📊 Calcular Puntaje Total
        id: calcular_puntaje
        if: always()
        run: |
          COMPILACION=${{ steps.compilacion.outputs.points || 0 }}
          TEST1=${{ steps.test1.outputs.points || 0 }}
          TEST2=${{ steps.test2.outputs.points || 0 }}
          TEST3=${{ steps.test3.outputs.points || 0 }}
          TEST4=${{ steps.test4.outputs.points || 0 }}
          TEST5=${{ steps.test5.outputs.points || 0 }}
          TEST6=${{ steps.test6.outputs.points || 0 }}
          
          TOTAL=$((COMPILACION + TEST1 + TEST2 + TEST3 + TEST4 + TEST5 + TEST6))
          PORCENTAJE=$((TOTAL * 100 / 14))
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 RESUMEN DE CALIFICACIÓN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Criterio | ✅ Puntos Obtenidos | 🎯 Puntos Posibles |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------------------:|-------------------:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Compilación | $COMPILACION | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test 1: Vehículo Ya Alquilado | $TEST1 | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test 2: Vehículo Disponible | $TEST2 | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test 3: Cancelar Alquiler | $TEST3 | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test 4: Encapsulamiento | $TEST4 | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test 5: Listar Vehículos | $TEST5 | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test 6: Cliente es Persona | $TEST6 | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| **📈 TOTAL** | **$TOTAL** | **14** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Calificación con emoji según porcentaje
          if [ $TOTAL -eq 14 ]; then
            EMOJI="🏆"
            MENSAJE="¡PERFECTO! Todas las pruebas pasaron"
            COLOR="🟢"
          elif [ $TOTAL -ge 10 ]; then
            EMOJI="🎉"
            MENSAJE="¡Muy bien! Buen trabajo"
            COLOR="🟢"
          elif [ $TOTAL -ge 6 ]; then
            EMOJI="⚠️"
            MENSAJE="Aprobado, pero hay margen de mejora"
            COLOR="🟡"
          else
            EMOJI="❌"
            MENSAJE="Necesitas revisar el código"
            COLOR="🔴"
          fi
          
          echo "### $COLOR $EMOJI CALIFICACIÓN FINAL: $TOTAL/14 puntos ($PORCENTAJE%)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> $MENSAJE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Guardar para uso en otros steps
          echo "total_points=$TOTAL" >> $GITHUB_OUTPUT
          echo "percentage=$PORCENTAJE" >> $GITHUB_OUTPUT
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
      
      # ========================================
      # GENERAR BADGE DE CALIFICACIÓN
      # ========================================
      - name: 🏅 Generar Badge de Calificación
        if: always()
        run: |
          TOTAL=${{ steps.calcular_puntaje.outputs.total_points }}
          PORCENTAJE=${{ steps.calcular_puntaje.outputs.percentage }}
          
          # Determinar color del badge
          if [ $PORCENTAJE -ge 90 ]; then
            COLOR="brightgreen"
          elif [ $PORCENTAJE -ge 70 ]; then
            COLOR="green"
          elif [ $PORCENTAJE -ge 50 ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          
          echo "Badge URL: https://img.shields.io/badge/Calificación-$TOTAL%2F14-$COLOR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![Calificación](https://img.shields.io/badge/Calificación-$TOTAL%2F14-$COLOR)" >> $GITHUB_STEP_SUMMARY
      
      # ========================================
      # COMENTARIO EN PR (Opcional)
      # ========================================
      - name: 💬 Comentar en Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const total = ${{ steps.calcular_puntaje.outputs.total_points || 0 }};
            const percentage = ${{ steps.calcular_puntaje.outputs.percentage || 0 }};
            const emoji = "${{ steps.calcular_puntaje.outputs.emoji || '❓' }}";
            
            const compilacion = ${{ steps.compilacion.outputs.points || 0 }};
            const test1 = ${{ steps.test1.outputs.points || 0 }};
            const test2 = ${{ steps.test2.outputs.points || 0 }};
            const test3 = ${{ steps.test3.outputs.points || 0 }};
            const test4 = ${{ steps.test4.outputs.points || 0 }};
            const test5 = ${{ steps.test5.outputs.points || 0 }};
            const test6 = ${{ steps.test6.outputs.points || 0 }};
            
            const body = `## ${emoji} Resultado de Autograding
            
            ### 📊 Calificación: **${total}/14 puntos (${percentage}%)**
            
            | Criterio | Puntos |
            |----------|--------|
            | 🔨 Compilación | ${compilacion}/2 |
            | 🧪 Test 1: Vehículo Ya Alquilado | ${test1}/2 |
            | 🧪 Test 2: Vehículo Disponible | ${test2}/2 |
            | 🧪 Test 3: Cancelar Alquiler | ${test3}/2 |
            | 🧪 Test 4: Encapsulamiento | ${test4}/2 |
            | 🧪 Test 5: Listar Vehículos | ${test5}/2 |
            | 🧪 Test 6: Cliente es Persona | ${test6}/2 |
            
            ---
            📝 Revisa los detalles completos en la pestaña [**Actions**](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });